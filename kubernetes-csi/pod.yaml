apiVersion: v1
kind: Pod
metadata:
  name: csi-s3-test-nginx
  namespace: default
spec:
  containers:
   - name: csi-s3-test-nginx
     image: busybox
     command: ["/bin/sh", "-c", "touch /var/www/hello-world"]
     volumeMounts:
       - mountPath: /var/www
         name: workdir
  restartPolicy: Never
  volumes:
   - name: workdir
     persistentVolumeClaim:
       claimName: csi-s3-pvc
       readOnly: false
